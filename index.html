<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProEduvate Launcher</title>
    <meta http-equiv="refresh" content="0; url=./frontend/" />
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        padding: 40px;
        background: #f7fbff;
        color: #0e223d;
      }
      .card {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px;
        border-radius: 14px;
        background: white;
        box-shadow: 0 10px 24px rgba(9, 50, 110, 0.08);
        border: 1px solid #d6e5ff;
      }
      h1 {
        margin: 0 0 8px;
      }
      p {
        margin: 6px 0 14px;
        color: #4f6b8f;
      }
      .links a {
        display: inline-block;
        margin-right: 12px;
        padding: 10px 16px;
        border-radius: 10px;
        text-decoration: none;
        background: #0d5bd7;
        color: white;
        font-weight: 600;
      }
      .links a.secondary {
        background: #e3edff;
        color: #0d5bd7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ProEduvate Admin Portal</h1>
      <p>Redirecting to the admin frontend...</p>
      <div class="links">
        <a href="./frontend/">Open Admin Portal</a>
        <a class="secondary" href="./frontend-react/">Open React App</a>
      </div>
    </div>
  </body>
</html>
